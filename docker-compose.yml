version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      # Add other environment variables as needed
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - mindshift-net

  frontend:
    build:
      context: ./frontend/vue-client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mindshift-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - mindshift-net

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # You should change this later
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mindshift-net

networks:
  mindshift-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

